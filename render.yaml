services:
  - type: web
    name: travelwise-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ML_SERVICE_URL
        sync: false

  - type: web
    name: travelwise-ml-service
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python fetch_model.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    envVars:
      - key: GH_TOKEN
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
